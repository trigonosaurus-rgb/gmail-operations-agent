# Monthly, one grouped pull request per ecosystem, so updates arrive as a few reviewable PRs.
# Major versions of the runtime stack are upgraded on purpose, not by a bot: Node stays on the
# current LTS line, Python on its minor release, TypeScript where openapi-typescript supports it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups: { images: { patterns: ["*"] } }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { frontend: { patterns: ["*"] } }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
